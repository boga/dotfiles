---
- name: "Install the whole environment for the OSX"
  hosts: all
  connection: local
  gather_facts: true
  tasks:
    - name: Install Homebrew taps
      community.general.homebrew_tap:
        state: present
        name: "{{ homebrew_taps }}"
      when: homebrew_taps | length > 0

    - name: Update Homebrew
      community.general.homebrew:
        update_homebrew: true

    # Install missing formulae without changing explicitly pinned versions.
    - name: Install packages
      community.general.homebrew:
        name: "{{ homebrew_packages }}"
        state: present

    # Bare formula upgrades skip formulae pinned with `brew pin`.
    - name: Upgrade unpinned formulae
      community.general.homebrew:
        upgrade_all: true
        upgrade_options:
          - formula

    # Install missing casks without changing explicitly pinned versions.
    - name: Install casks
      community.general.homebrew_cask:
        name: "{{ homebrew_casks }}"
        state: present

    # Bare cask upgrades skip casks pinned with `brew pin --cask`.
    - name: Upgrade unpinned casks
      community.general.homebrew_cask:
        upgrade_all: true

    - name: "Copy configs"
      ansible.builtin.include_role:
        name: config_files
      vars:
        config_files_items: "{{ config_files + (config_files_host | default([])) }}"

    - name: "Configure Git"
      ansible.builtin.include_role:
        name: git

    - name: "Configure macOS defaults"
      ansible.builtin.include_role:
        name: osx_settings

    - name: "Create mise conf.d directory"
      ansible.builtin.file:
        path: "~/.config/mise/conf.d"
        state: directory
        mode: '0700'

    - name: "Generate worktrunk shell integration"
      ansible.builtin.command: wt config shell init zsh
      register: wt_shell_init
      changed_when: false

    - name: "Write worktrunk shell integration to ~/.zshrc.worktrunk"
      ansible.builtin.copy:
        content: "{{ wt_shell_init.stdout }}\n"
        dest: "~/.zshrc.worktrunk"
        mode: '0600'

    - name: "Install and configure Pi agent"
      ansible.builtin.include_role:
        name: pi_agent

  post_tasks:
    - name: "Upgrade mise-managed tools"
      ansible.builtin.command: mise upgrade
      changed_when: true

    - name: "Update Pi extensions"
      ansible.builtin.command: pi update --extensions
      changed_when: true
