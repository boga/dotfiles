---
- name: "Ensure Pi agent directory exists"
  ansible.builtin.file:
    path: "{{ pi_agent_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_group }}"
    mode: "0755"

- name: "Read installed herdr-core skill"
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts['env']['HOME'] }}/.bin/hc"
      - "--skill"
  register: pi_hc_skill
  changed_when: false
  check_mode: false

- name: "Ensure Herdr skill directory exists"
  ansible.builtin.file:
    path: "{{ pi_agent_dir }}/skills/herdr"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_group }}"
    mode: "0755"

- name: "Deploy installed herdr-core skill"
  ansible.builtin.copy:
    dest: "{{ pi_agent_dir }}/skills/herdr/SKILL.md"
    content: |
      ---
      name: herdr
      description: Manage native Herdr terminals and agents with hc; control its window with herdr-app.
      ---

      {{ pi_hc_skill.stdout }}
    owner: "{{ ansible_user }}"
    group: "{{ ansible_group }}"
    mode: "0644"

- name: "Configure Pi agent settings"
  ansible.builtin.import_tasks: settings.yml

- name: "Configure Pi agent MCP servers"
  ansible.builtin.import_tasks: mcp.yml
