---
# Requires: ansible-galaxy collection install community.general
- name: "Show all filename extensions in Finder"
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleShowAllExtensions
    type: bool
    value: true
    state: present
  register: osx_settings_show_all_extensions

- name: "Configure Finder toolbar"
  community.general.osx_defaults:
    domain: com.apple.finder
    key: "NSToolbar Configuration Browser"
    type: dict
    value:
      TB Display Mode: 1
      TB Icon Size Mode: 1
      TB Is Shown: 1
      TB Size Mode: 1
      TB Visibility Priority Values: {}
      TB Item Identifiers:
        # Back / Forward navigation
        - com.apple.finder.BACK

        # Finder view-style and arrange/sort controls
        - com.apple.finder.SWCH

        # Create a new folder
        - com.apple.finder.NFLD

        # Flexible positioning before actions on the right
        - NSToolbarFlexibleSpaceItem

        # Closest supported equivalent of a Send via AirDrop button:
        # Share menu, which exposes AirDrop when available.
        - com.apple.finder.SHAR

        # Apply Finder tags
        - com.apple.finder.LABL

        # Finder actions / overflow-style menu
        - com.apple.finder.ACTN

        # Search field
        - com.apple.finder.SRCH
    state: present
  register: osx_settings_finder_toolbar

- name: "Restart Finder to apply preference changes"
  ansible.builtin.command: killall Finder
  changed_when: true
  when: osx_settings_show_all_extensions.changed or osx_settings_finder_toolbar.changed
