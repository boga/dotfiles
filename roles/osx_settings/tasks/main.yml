---
# Requires: ansible-galaxy collection install community.general
- name: "Show all filename extensions in Finder"
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleShowAllExtensions
    type: bool
    value: true
    state: present
  notify: Restart Finder

# Removes any managed Finder toolbar layout, reverting to the macOS stock toolbar.
#
# This key is deliberately NOT managed. An earlier revision of this role set it
# with `community.general.osx_defaults` using `type: dict` and a nested value.
# That module cannot serialize nesting: `_dict_value_to_args` types only int and
# float, and falls through to `-string str(val)` for everything else. The
# `TB Item Identifiers` list was therefore written as a Python repr string:
#
#   <key>TB Item Identifiers</key>
#   <string>['com.apple.finder.BACK', 'com.apple.finder.SWCH', ...]</string>
#
# where Finder's NSToolbar deserializer requires an <array>. Finder would launch
# but fail to build a toolbar, so no window ever appeared. Deleting the key is
# what unblocks it. Do not reintroduce a nested-dict osx_defaults task here; if
# the toolbar must be managed again, write it with `plutil -replace -xml` so the
# <array> and <dict> types survive.
- name: "Remove managed Finder toolbar layout"
  community.general.osx_defaults:
    domain: com.apple.finder
    key: "NSToolbar Configuration Browser"
    state: absent
  notify: Restart Finder

# Sets the default search scope in the Finder search bar to the current folder ('SCcf') rather than the entire Mac ('SCev').
- name: "Search current folder by default"
  community.general.osx_defaults:
    domain: com.apple.finder
    key: FXDefaultSearchScope
    type: string
    value: SCcf
    state: present
  notify: Restart Finder

# Forces folders to open in tabs within the existing window instead of spawning a new Finder window.
- name: "Open folders in tabs instead of new windows"
  community.general.osx_defaults:
    domain: com.apple.finder
    key: FinderSpawnTab
    type: bool
    value: true
    state: present
  notify: Restart Finder

# Defines the target type for newly opened Finder windows ('PfLo' selects a custom "Other..." folder, set via NewWindowTargetPath below).
- name: "Set target folder for new Finder windows (Target Code)"
  community.general.osx_defaults:
    domain: com.apple.finder
    key: NewWindowTarget
    type: string
    value: PfLo
    state: present
  notify: Restart Finder

# Sets the exact file URI path used when opening new Finder windows, pointing to the current user's Downloads folder.
- name: "Set target folder path for new Finder windows"
  community.general.osx_defaults:
    domain: com.apple.finder
    key: NewWindowTargetPath
    type: string
    value: "file://{{ lookup('env', 'HOME') }}/Downloads/"
    state: present
  notify: Restart Finder

# Enables the breadcrumb path bar along the bottom of the Finder window (View > Show Path Bar).
- name: "Show path bar in Finder"
  community.general.osx_defaults:
    domain: com.apple.finder
    key: ShowPathbar
    type: bool
    value: true
    state: present
  notify: Restart Finder

# Enables the status bar at the bottom to show item counts and available disk storage (View > Show Status Bar).
- name: "Show status bar in Finder"
  community.general.osx_defaults:
    domain: com.apple.finder
    key: ShowStatusBar
    type: bool
    value: true
    state: present
  notify: Restart Finder
