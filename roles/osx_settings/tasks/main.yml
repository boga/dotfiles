---
# Requires: ansible-galaxy collection install community.general
- name: "Show all filename extensions in Finder"
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleShowAllExtensions
    type: bool
    value: true
    state: present
  notify: Restart Finder

# Finder toolbar layout. The desired state is exact rather than merged with any
# stale value, hence dict_mode: replace. The value lives in defaults/main.yml,
# captured from a Finder-written value via:
#
#   defaults read com.apple.finder "NSToolbar Configuration Browser"
#
# WARNING: community.general.osx_defaults cannot serialise nested values.
# `_dict_value_to_args` types only bool, int and float, then falls through to
# `-string str(val)` for everything else, so the two nested identifier lists are
# written to the plist as Python repr strings:
#
#   <key>TB Item Identifiers</key>
#   <string>['com.apple.finder.BACK', 'com.apple.finder.SWCH', ...]</string>
#
# Finder's NSToolbar deserialiser requires an <array> there. Given a string it
# fails to build a toolbar and Finder runs as a live process without ever
# opening a window. Recover with:
#
#   defaults delete com.apple.finder "NSToolbar Configuration Browser"
#   killall Finder
#
# This task is also not idempotent. The module reads the value back through
# `defaults export` piped to `plutil -extract`, which preserves types, so the
# string it wrote never compares equal to the list defined here. It therefore
# reports changed on every run and restarts Finder each time.
#
# `plutil -replace -json` writes this key with the correct <array> and <integer>
# types and compares cleanly; see the role README for that approach.
- name: "Configure Finder toolbar"
  community.general.osx_defaults:
    domain: com.apple.finder
    key: "NSToolbar Configuration Browser"
    type: dict
    dict_mode: replace
    value: "{{ osx_finder_toolbar }}"
    state: present
  notify: Restart Finder

# Sets the default search scope in the Finder search bar to the current folder ('SCcf') rather than the entire Mac ('SCev').
- name: "Search current folder by default"
  community.general.osx_defaults:
    domain: com.apple.finder
    key: FXDefaultSearchScope
    type: string
    value: SCcf
    state: present
  notify: Restart Finder

# Forces folders to open in tabs within the existing window instead of spawning a new Finder window.
- name: "Open folders in tabs instead of new windows"
  community.general.osx_defaults:
    domain: com.apple.finder
    key: FinderSpawnTab
    type: bool
    value: true
    state: present
  notify: Restart Finder

# Defines the target for newly opened Finder windows. 'PfHm' is the preset code
# for the user's home directory, so no companion path key is required.
- name: "Open new Finder windows in the home directory"
  community.general.osx_defaults:
    domain: com.apple.finder
    key: NewWindowTarget
    type: string
    value: PfHm
    state: present
  notify: Restart Finder

# Sets the exact file URI path used when opening new Finder windows, pointing to the current user's Downloads folder.
- name: "Set target folder path for new Finder windows"
  community.general.osx_defaults:
    domain: com.apple.finder
    key: NewWindowTargetPath
    type: string
    value: "file://{{ lookup('env', 'HOME') }}/Downloads/"
    state: present
  notify: Restart Finder

# Enables the breadcrumb path bar along the bottom of the Finder window (View > Show Path Bar).
- name: "Show path bar in Finder"
  community.general.osx_defaults:
    domain: com.apple.finder
    key: ShowPathbar
    type: bool
    value: true
    state: present
  notify: Restart Finder

# Enables the status bar at the bottom to show item counts and available disk storage (View > Show Status Bar).
- name: "Show status bar in Finder"
  community.general.osx_defaults:
    domain: com.apple.finder
    key: ShowStatusBar
    type: bool
    value: true
    state: present
  notify: Restart Finder
