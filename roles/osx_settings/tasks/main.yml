---
- name: "Show all filename extensions in Finder"
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleShowAllExtensions
    type: bool
    value: true
    state: present
  notify: Restart Finder

# Finder toolbar layout. Deliberately NOT handled by community.general.osx_defaults.
#
# That module cannot serialise nested values: `_dict_value_to_args` types only
# bool, int and float, then falls through to `-string str(val)` for everything
# else. A `type: dict` task here writes the two nested identifier lists as Python
# repr strings:
#
#   <key>TB Item Identifiers</key>
#   <string>['com.apple.finder.BACK', 'com.apple.finder.SWCH', ...]</string>
#
# Finder's NSToolbar deserialiser requires an <array> there. Given a string it
# fails to build a toolbar and Finder runs as a live process without ever
# opening a window. This was reproduced deliberately: with the live value
# perturbed by one item, the module reported changed and rewrote both lists as
# strings, while the surrounding scalars stayed <integer>. The corrupted plist
# still passed `plutil -lint`, so nothing surfaced the fault. Once written it
# never converges either, since the type-preserving read never again matches the
# list defined in defaults/main.yml. Do not reintroduce an osx_defaults task for
# this key.
#
# `plutil -replace -json` is used instead: it maps JSON numbers to <integer> and
# JSON arrays to <array>, so the types survive. Reads and writes go through
# `defaults export`/`import` over stdin/stdout rather than editing the plist in
# place, because cfprefsd caches that file in memory and would clobber a direct
# edit, and rather than a temp file, since plutil accepts '-' for both input and
# output.
- name: "Read current Finder toolbar configuration"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      defaults export com.apple.finder -
      | plutil -extract "NSToolbar Configuration Browser" json -o - -
    executable: /bin/bash
  register: osx_finder_toolbar_current
  changed_when: false
  failed_when: false

# Absent or malformed values yield empty stdout, which counts as needing a write.
# Jinja's `or` short-circuits, so from_json is never handed an empty string.
- name: "Determine whether the Finder toolbar needs updating"
  ansible.builtin.set_fact:
    osx_finder_toolbar_needs_update: >-
      {{ (osx_finder_toolbar_current.stdout | default('', true) | trim) == ''
         or (osx_finder_toolbar_current.stdout | from_json) != osx_finder_toolbar }}

# `quote` shell-escapes the JSON for embedding in the pipeline below. The known
# toolbar identifiers contain no shell metacharacters, but the value is user data
# from defaults/main.yml, so it is not trusted to be shell-safe by construction.
- name: "Apply Finder toolbar configuration"
  when: osx_finder_toolbar_needs_update | bool
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      defaults export com.apple.finder -
      | plutil -replace "NSToolbar Configuration Browser" -json {{ osx_finder_toolbar | to_json | quote }} -o - -
      | defaults import com.apple.finder -
    executable: /bin/bash
  notify: Restart Finder

# Sets the default search scope in the Finder search bar to the current folder ('SCcf') rather than the entire Mac ('SCev').
- name: "Search current folder by default"
  community.general.osx_defaults:
    domain: com.apple.finder
    key: FXDefaultSearchScope
    type: string
    value: SCcf
    state: present
  notify: Restart Finder

# Forces folders to open in tabs within the existing window instead of spawning a new Finder window.
- name: "Open folders in tabs instead of new windows"
  community.general.osx_defaults:
    domain: com.apple.finder
    key: FinderSpawnTab
    type: bool
    value: true
    state: present
  notify: Restart Finder

# Defines the target type for newly opened Finder windows ('PfLo' selects a custom "Other..." folder, set via NewWindowTargetPath below).
- name: "Set target folder for new Finder windows (Target Code)"
  community.general.osx_defaults:
    domain: com.apple.finder
    key: NewWindowTarget
    type: string
    value: PfLo
    state: present
  notify: Restart Finder

# Sets the exact file URI path used when opening new Finder windows, pointing to the current user's Downloads folder.
- name: "Set target folder path for new Finder windows"
  community.general.osx_defaults:
    domain: com.apple.finder
    key: NewWindowTargetPath
    type: string
    value: "file://{{ lookup('env', 'HOME') }}/Downloads/"
    state: present
  notify: Restart Finder

# Enables the breadcrumb path bar along the bottom of the Finder window (View > Show Path Bar).
- name: "Show path bar in Finder"
  community.general.osx_defaults:
    domain: com.apple.finder
    key: ShowPathbar
    type: bool
    value: true
    state: present
  notify: Restart Finder

# Enables the status bar at the bottom to show item counts and available disk storage (View > Show Status Bar).
- name: "Show status bar in Finder"
  community.general.osx_defaults:
    domain: com.apple.finder
    key: ShowStatusBar
    type: bool
    value: true
    state: present
  notify: Restart Finder
