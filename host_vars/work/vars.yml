---
ansible_user: ivan-shnurchenko
ansible_group: staff
ansible_python_interpreter: /opt/homebrew/bin/python3

pi_plannotator_planning_model:
  provider: "anthropic"
  id: "claude-opus-5-5"
pi_plannotator_executing_model:
  provider: "anthropic"
  id: "claude-sonnet-5-5"
pi_plannotator_reviewing_model:
  provider: "anthropic"
  id: "claude-opus-5-5"

# Model tiers consumed by templates/pi/agents/*.md. Every model listed here
# must also appear in pi_agent_settings_overrides_local.enabledModels below.
pi_agent_model_fast: "anthropic/claude-haiku-4-5"
pi_agent_model_daily: "anthropic/claude-sonnet-5-5"
pi_agent_model_deep: "anthropic/claude-opus-5-5"
# Reviewer overrides the shared default (group_vars/all.yml) to use an
# OpenAI Codex model instead of the deep tier's Claude Opus.
pi_agent_model_reviewer: "openai-codex/gpt-5.6-sol"

# Work-only MCP servers, merged over pi_agent_mcp_servers_base in
# group_vars/all.yml.
pi_agent_mcp_servers_local:
  # OAuth servers need no credentials here. Sign in once with
  # `pi mcp login <name>` (or `/mcp` in Pi); tokens live in ~/.pi/agent/mcp-auth.json.
  notion:
    type: "streamable-http"
    url: "https://mcp.notion.com/mcp"
    description: "Notion workspace: search, read and edit pages and databases"
  new-relic:
    type: "http"
    url: "https://mcp.eu.newrelic.com/mcp/"
    headers:
      Api-Key: "${NEW_RELIC_MCP_API_KEY}"
      include-tags: "discovery,data-access,alerting,incident-response,performance-analytics,advanced-analysis"
    description: "New Relic observability: NRQL queries, alerts, incidents and entity discovery"
  linear:
    type: "streamable-http"
    url: "https://mcp.linear.app/mcp"
    description: "Linear issues, projects, milestones and workflow states"
    # OAuth 2.1 with dynamic client registration, discovered from the endpoint,
    # so no static secret is stored. Run `pi mcp login linear` once.
    # `deferred` keeps the ~78 tools out of the prompt until `tool_search` loads
    # a match; LinearScout reaches them this way.
    exposure: "deferred"
  n8n:
    type: "http"
    url: "https://dev-n8n-server.api-swap-os.com/mcp-server/http"
    description: "n8n workflow automation server: list, inspect and run workflows"
    # OAuth 2.1 with dynamic client registration, discovered from the endpoint.
    # Run `pi mcp login n8n` once.

pi_agent_settings_overrides_local:
  enabledModels:
    - "anthropic/claude-haiku-4-5"
    - "anthropic/claude-sonnet-5-5"
    - "anthropic/claude-opus-5-5"
    - "openai-codex/gpt-5.6-luna"
    - "openai-codex/gpt-5.6-terra"
    - "openai-codex/gpt-5.6-sol"
    - "openai-codex/gpt-6-astra"

# Work-specific packages, appended to the global pi_agent_settings_packages list
pi_agent_settings_extra_packages: []
