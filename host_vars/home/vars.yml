---
ansible_user: miju
ansible_group: staff
# Every agent runs on an xAI Grok model on this host. 4.3 handles simple
# work (cheapest; 30k output cap), 4.6 is the daily driver, and 4.7 handles
# complex work. These tiers are consumed by templates/pi/agents/*.md.
pi_agent_model_fast: "xai/grok-4.3"
pi_agent_model_daily: "xai/grok-4.6"
pi_agent_model_deep: "xai/grok-4.7"

pi_agent_settings_overrides_local:
  enabledModels:
    - "xai/grok-4.3"
    - "xai/grok-4.5"
    - "xai/grok-4.6"
    - "xai/grok-4.7"

pi_plannotator_planning_model:
  provider: "xai"
  id: "grok-4.7"
pi_plannotator_executing_model:
  provider: "xai"
  id: "grok-4.6"
pi_plannotator_reviewing_model:
  provider: "xai"
  id: "grok-4.7"
