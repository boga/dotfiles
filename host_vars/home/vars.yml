---
ansible_user: miju
ansible_group: staff

# Luna handles simple work, terra is the daily driver, and sol handles complex work.
# These tiers are rendered as model-selection guidance in templates/pi/AGENTS.md.
pi_agent_model_fast: "openai-codex/gpt-6-luna"
pi_agent_model_daily: "openai-codex/gpt-6.1-terra"
pi_agent_model_deep: "openai-codex/gpt-6.1-sol"

pi_agent_settings_overrides_local:
  defaultProvider: "openai-codex"
  defaultModel: "gpt-6.1-terra"
  enabledModels:
    - "xai/grok-4.3"
    - "xai/grok-4.5"
    - "xai/grok-4.6"
    - "xai/grok-4.7"
    - "openai-codex/gpt-5.6-luna"
    - "openai-codex/gpt-5.6-terra"
    - "openai-codex/gpt-5.6-sol"
    - "openai-codex/gpt-6-luna"
    - "openai-codex/gpt-6.1-terra"
    - "openai-codex/gpt-6.1-sol"

pi_plannotator_planning_model:
  provider: "openai-codex"
  id: "gpt-6.1-sol"
pi_plannotator_executing_model:
  provider: "openai-codex"
  id: "gpt-6.1-terra"
pi_plannotator_reviewing_model:
  provider: "openai-codex"
  id: "gpt-6.1-sol"
