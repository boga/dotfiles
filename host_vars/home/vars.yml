---
ansible_user: miju
ansible_group: staff
ansible_python_interpreter: /usr/local/bin/python3.14
firefox_profile_dir: /Users/miju/Library/Application Support/Firefox/Profiles/pex9ak71.default-release

# Every agent runs on an OpenAI Codex GPT-5.6 variant on this host; luna
# handles simple work, terra is the daily driver, and sol handles complex work.
# These tiers are consumed by templates/pi/agents/*.md.
pi_agent_model_fast: "openai-codex/gpt-5.6-luna"
pi_agent_model_daily: "openai-codex/gpt-5.6-terra"
pi_agent_model_deep: "openai-codex/gpt-5.6-sol"

pi_agent_settings_overrides_local:
  enabledModels:
    - "openai-codex/gpt-5.6-luna"
    - "openai-codex/gpt-5.6-terra"
    - "openai-codex/gpt-5.6-sol"

pi_plannotator_planning_model:
  provider: "openai-codex"
  id: "gpt-5.6-sol"
pi_plannotator_executing_model:
  provider: "openai-codex"
  id: "gpt-5.6-terra"
pi_plannotator_reviewing_model:
  provider: "openai-codex"
  id: "gpt-5.6-sol"
